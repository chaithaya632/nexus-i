[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-pt"
version = "1.0.0.dev0"
description = "NEXUS — AI-Optional Autonomous Penetration Testing Framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "NEXUS Project"}]
keywords = ["penetration-testing", "security", "offensive-security", "pentest", "kali"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "networkx>=3.2",
    "aiofiles>=24.1.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "psutil>=5.9.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
report = ["weasyprint>=62.0", "python-docx>=1.1.0"]
dashboard = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
ai = ["ollama>=0.4.0"]
ml = ["scikit-learn>=1.4.0", "scipy>=1.14.0"]
browser = ["playwright>=1.45.0"]
full = ["nexus-pt[report,dashboard,ai,ml,browser]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0", "ruff>=0.8.0"]

[project.scripts]
nexus = "nexus.main:cli"

[project.entry-points."nexus.plugins"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
