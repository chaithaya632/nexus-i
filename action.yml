name: "NEXUS Security Scan"
description: "Run an AI-optional NEXUS DevSecOps scan, emit SARIF, and optionally diff against a baseline engagement."
inputs:
  target:
    description: "Target domain, URL, or host in authorized scope"
    required: true
  scope_file:
    description: "Path to scope.yaml"
    required: true
  profile:
    description: "Scan profile (quick, web, network, api, full)"
    required: false
    default: "api"
  openapi_spec:
    description: "Optional path to OpenAPI/Swagger spec"
    required: false
    default: ""
  ignore_file:
    description: "Optional path to .nexusignore file"
    required: false
    default: ""
  sarif_output:
    description: "Output SARIF v2.1.0 file path"
    required: false
    default: "nexus-results.sarif"
  baseline_id:
    description: "Optional baseline engagement ID for nexus diff regression gating"
    required: false
    default: ""
  fail_on_new:
    description: "Comma-separated severities that fail diff check (e.g. critical,high)"
    required: false
    default: "critical,high"

outputs:
  sarif_file:
    description: "Path to generated SARIF report"
    value: ${{ steps.run-scan.outputs.sarif_file }}
  engagement_id:
    description: "Completed NEXUS engagement ID"
    value: ${{ steps.run-scan.outputs.engagement_id }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install NEXUS
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install -e "$ACTION_PATH"

    - name: Run NEXUS Engagement & Export SARIF
      id: run-scan
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_SCOPE_FILE: ${{ inputs.scope_file }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_OPENAPI_SPEC: ${{ inputs.openapi_spec }}
        INPUT_IGNORE_FILE: ${{ inputs.ignore_file }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif_output }}
        INPUT_BASELINE_ID: ${{ inputs.baseline_id }}
        INPUT_FAIL_ON_NEW: ${{ inputs.fail_on_new }}
      run: |
        set -euo pipefail
        ARGS=(engage "$INPUT_TARGET" --scope "$INPUT_SCOPE_FILE" --profile "$INPUT_PROFILE" --no-exploit)
        if [ -n "$INPUT_OPENAPI_SPEC" ]; then ARGS+=(--openapi "$INPUT_OPENAPI_SPEC"); fi
        if [ -n "$INPUT_IGNORE_FILE" ]; then ARGS+=(--ignore "$INPUT_IGNORE_FILE"); fi
        nexus "${ARGS[@]}"
        ENG_ID=$(python3 -c "from nexus.core.config import NexusConfig; from nexus.db.store import EngagementStore; engs = EngagementStore(NexusConfig.load().db_path).list_engagements(); print(engs[0].id if engs else '')")
        if [ -z "$ENG_ID" ]; then
          echo "::error::Failed to resolve latest NEXUS engagement ID"
          exit 1
        fi
        nexus report -e "$ENG_ID" -f sarif -o "$INPUT_SARIF_OUTPUT"
        {
          echo "engagement_id=$ENG_ID"
          echo "sarif_file=$INPUT_SARIF_OUTPUT"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$INPUT_BASELINE_ID" ]; then
          nexus diff "$INPUT_BASELINE_ID" "$ENG_ID" --fail-on-new "$INPUT_FAIL_ON_NEW"
        fi
