# CVE-specific Remediation Guidance — NEXUS Knowledge Base

remediations:
  - id: CVE-2021-41773
    title: Apache HTTP Server 2.4.49 Path Traversal
    severity: critical
    short_fix: Upgrade Apache HTTP Server to 2.4.51 or later and deny 'Require all denied' outside DocumentRoot.
    detailed_fix: |
      Apache HTTP Server 2.4.49 contains a path normalization flaw allowing path traversal and CGI code execution.
      Upgrade directly to 2.4.51+ (skipping 2.4.50 due to CVE-2021-42013) and restrict directory access explicitly.
    tags: [apache, path-traversal, rce]

  - id: CVE-2024-6387
    title: OpenSSH regreSSHion Signal Handler Race Condition
    severity: critical
    short_fix: Upgrade OpenSSH to 9.8p1 or later (or apply vendor backport) and keep LoginGraceTime 0 as temporary mitigation if unpatched.
    detailed_fix: |
      Update openssh-server to 9.8p1+ via OS package manager. Verify sshd -V reflects patched build.
    tags: [openssh, ssh, rce]

  - id: CVE-2023-38408
    title: OpenSSH ssh-agent PKCS#11 Remote Code Execution
    severity: critical
    short_fix: Upgrade OpenSSH to 9.3p2 or later and disable AllowAgentForwarding on untrusted hosts.
    detailed_fix: |
      Update OpenSSH packages across servers and workstations, and configure 'AllowAgentForwarding no' in sshd_config.
    tags: [openssh, ssh-agent]

  - id: CVE-2024-23897
    title: Jenkins CLI Arbitrary File Read
    severity: critical
    short_fix: Upgrade Jenkins to 2.442 / LTS 2.426.3+ or disable Jenkins CLI remoting.
    detailed_fix: |
      Disable access to CLI command parser on older Jenkins instances and apply security advisory fix immediately.
    tags: [jenkins, file-read]

  - id: CVE-2021-43798
    title: Grafana Plugin Path Traversal
    severity: high
    short_fix: Upgrade Grafana to 8.3.1+, 8.2.7+, 8.1.8+, or 8.0.7+ behind reverse proxy path normalization.
    detailed_fix: |
      Patch Grafana immediately and ensure any exposed admin/plugin paths are restricted to internal networks.
    tags: [grafana, path-traversal]

  - id: CVE-2022-22965
    title: Spring Framework Spring4Shell RCE
    severity: critical
    short_fix: Upgrade Spring Framework to 5.3.18+ or 5.2.20+ (and Spring Boot 2.6.6+ / 2.5.12+).
    detailed_fix: |
      Upgrade Spring core dependencies and rebuild deployable WAR/JAR artifacts cleanly.
    tags: [spring, java, rce]

  - id: CVE-2021-44228
    title: Apache Log4j2 JNDI Remote Code Execution (Log4Shell)
    severity: critical
    short_fix: Upgrade Log4j2 to 2.17.1+ (Java 8+) or remove JndiLookup class from classpath.
    detailed_fix: |
      Upgrade all Log4j-core artifacts to >= 2.17.1 (Java 8) or 2.12.4 (Java 7), avoiding relying solely on formatMsgNoLookups.
    tags: [log4j, java, jndi]

  - id: CVE-2018-7600
    title: Drupal Drupalgeddon 2 Form API RCE
    severity: critical
    short_fix: Upgrade Drupal Core immediately to 7.58+, 8.3.9+, 8.4.6+, or 8.5.1+ (or modern Drupal 10+).
    detailed_fix: |
      Apply official Drupal security release SA-CORE-2018-002 to sanitize Form API array keys in request payloads.
    tags: [drupal, cms, rce]

  - id: CVE-2023-23752
    title: Joomla 4.x Webservice Config Disclosure
    severity: medium
    short_fix: Upgrade Joomla to 4.2.8 or later and rotate exposed database/service credentials.
    detailed_fix: |
      Update Joomla Core to 4.2.8+ so unauthenticated requests to /api/index.php/v1/config/application are rejected cleanly.
    tags: [joomla, cms, exposure]
